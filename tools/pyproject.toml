[project]
name = "tailapp-genre-tools"
version = "0.1.0"
description = "Offline model-preparation scripts for TailApp's on-device genre classifier"
readme = "README.md"

# TensorFlow publishes no wheels for 3.13/3.14 (the system interpreter here is
# 3.14), so the interpreter is pinned to one it does support. `uv sync` will
# fetch a managed CPython 3.11 rather than touching the system install.
requires-python = ">=3.11,<3.12"

dependencies = [
    # TF is needed only to *read* the frozen graphs; inference is done by
    # onnxruntime so the Python and the Kotlin sides run the same engine.
    #
    # On Windows the `tensorflow-cpu` wheel is a 2 KB stub whose only job is to
    # pull in `tensorflow-intel`, and it declares that in per-wheel metadata that
    # uv's universal resolver does not see — install it here and you get the stub
    # and no `tensorflow` module. Naming the real distribution per platform is
    # what makes `uv sync` reproducible on all three.
    "tensorflow-intel==2.15.1 ; sys_platform == 'win32'",
    "tensorflow-cpu==2.15.1 ; sys_platform != 'win32'",
    "tf2onnx==1.16.1",
    "onnx==1.16.1",
    "onnxruntime==1.17.3",
    # TF 2.15 is a numpy-1 build; tf2onnx 1.16 has not been ported to numpy 2.
    "numpy==1.26.4",
    # The one version both TF 2.15 and tf2onnx 1.16 accept.
    "protobuf==3.20.3",
    # TF 2.15 pulls this in unconditionally, but upstream stopped publishing
    # Windows wheels after 0.31.0. Nothing here reads from GCS; the pin exists
    # only so the resolver can finish on win_amd64.
    "tensorflow-io-gcs-filesystem==0.31.0 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# BeatNet work only — `uv sync --extra beatnet`. Two of the six scripts
# (export_beatnet.py, dump_beat_reference.py) fail at import without it; the
# other four, and the whole genre-model pipeline, do not need any of this.
#
# It is an extra rather than a base dependency because torch is ~2 GB of wheels
# and every checkout would pay for it to run a one-off export.
#
# Note what is *not* here: madmom and BeatNet themselves. Neither is
# pip-installed — `download_beatnet.py` unpacks BeatNet's wheel and madmom's
# sdist into <repo>/models/ and the scripts put those on sys.path. madmom 0.16.1
# ships only an sdist that Cythonises three .pyx files, so `pip install madmom`
# needs a toolchain and an ancient Cython on 3.11; the modules actually used are
# its pure-Python feature path, which needs nothing but numpy and scipy.
beatnet = [
    # export_beatnet.py loads BeatNet's .pt checkpoints and runs torch.onnx.export.
    "torch==2.2.2",
    # madmom's pure-Python feature modules (audio.signal/stft/filters/spectrogram)
    # import scipy; nothing else in this project pulls it in.
    "scipy==1.11.4",
]

[tool.uv]
package = false
